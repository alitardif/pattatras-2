services:
  app:
    build: .
    container_name: pattatras-app
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: prod
      APP_SECRET: change_me_pattatras_secret_key_32
      APP_DEBUG: "0"
    networks:
      - pattatras

  nginx:
    image: nginx:1.27-alpine
    container_name: pattatras-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - pattatras

networks:
  pattatras:
    driver: bridge
